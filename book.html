<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger · Entries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef0ea;
    --panel: #ffffff;
    --ink: #14171a;
    --ink-2: #3f454a;
    --ink-3: #5c6266;
    --line: #dfe3dc;
    --line-soft: #eceee9;
    --in: #0f6b45;
    --out: #a23325;
    --action: #1c1f22;
    --r-panel: 10px;
    --r-control: 4px;
    --shell: 1180px;
    --display: "Instrument Serif", Georgia, "Times New Roman", serif;
    --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  a { color: inherit; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--text);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .shell {
    width: 100%;
    max-width: var(--shell);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- top bar ---------- */

  .topbar { background: var(--panel); }

  .topbar__inner {
    display: flex;
    align-items: center;
    gap: 24px;
    height: 60px;
  }

  .wordmark {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    text-decoration: none;
    font-family: var(--display);
    font-size: 22px;
    letter-spacing: -0.01em;
  }

  .wordmark span { font-family: var(--text); font-size: 13px; color: var(--ink-3); letter-spacing: 0; }

  .topbar__scope {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-3);
  }

  .keychip {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--paper);
    border-radius: var(--r-control);
    padding: 2px 8px;
  }

  .btn {
    font: inherit;
    font-weight: 500;
    border: 0;
    border-radius: var(--r-control);
    padding: 9px 16px;
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease;
  }

  .btn--primary { background: var(--action); color: #fff; }
  .btn--primary:hover { background: #000; }

  .btn--quiet { background: transparent; color: var(--ink-2); padding: 9px 12px; }
  .btn--quiet:hover { color: var(--ink); background: var(--paper); }

  /* ---------- page ---------- */

  main { padding: 32px 0 72px; }

  .titlerow {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 4px;
  }

  .finding { margin: 0; font-size: 15px; color: var(--ink-2); }

  .panel {
    background: var(--panel);
    border-radius: var(--r-panel);
    padding: 24px;
    margin-bottom: 20px;
  }

  h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 18px;
    letter-spacing: 0;
  }

  /* ---------- summary ---------- */

  .summary {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr);
    align-items: center;
    gap: 0;
  }

  .summary__lead { padding-right: 32px; }

  .summary__label { display: block; font-size: 14px; color: var(--ink-3); }

  .summary__value {
    display: block;
    font-family: var(--display);
    font-size: 46px;
    line-height: 1;
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
  }

  .summary__grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 0;
    padding: 0 0 0 40px;
  }

  .summary__grid > div { padding: 4px 0 4px 28px; }

  .summary__grid dt { font-size: 13px; color: var(--ink-3); }

  .summary__grid dd {
    margin: 4px 0 0;
    font-size: 21px;
    font-variant-numeric: tabular-nums;
  }

  .summary__grid dd.is-in { color: var(--in); }
  .summary__grid dd.is-out { color: var(--out); }

  /* ---------- entry form ---------- */

  .entry {
    display: grid;
    grid-template-columns: 150px 130px 1fr 140px minmax(160px, 1.4fr) auto;
    gap: 12px;
    align-items: end;
  }

  .field { display: grid; gap: 6px; min-width: 0; }

  .field > span { font-size: 13px; color: var(--ink-3); }

  .input, select.input {
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #f2f4ef;
    border: 0;
    border-radius: var(--r-control);
    padding: 9px 11px;
    width: 100%;
    min-width: 0;
  }

  .input--num { font-variant-numeric: tabular-nums; }

  .entry .btn--primary { height: 38px; }

  .formnote { margin: 14px 0 0; font-size: 14px; color: var(--out); min-height: 20px; }
  .formnote:empty { min-height: 0; }

  /* ---------- entries table ---------- */

  .panel__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .panel__head h2 { margin: 0; }

  .filters { display: flex; gap: 8px; }

  .filters .input { width: auto; min-width: 132px; font-size: 14px; padding: 6px 10px; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }

  thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-3);
    padding: 0 12px 8px;
    border: 0;
  }

  thead th.num { text-align: right; }

  tbody td {
    padding: 12px;
    border-top: 1px solid var(--line-soft); /* taste-skill-ignore hairline: table rows */
    font-size: 15px;
    vertical-align: baseline;
  }

  tbody td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  tbody td.date { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  tbody td.note { color: var(--ink-2); }

  tbody tr:hover { background: #f7f8f5; }

  .amt--in { color: var(--in); }
  .amt--out { color: var(--out); }

  .del {
    font: inherit;
    font-size: 13px;
    color: var(--ink-3);
    background: transparent;
    border: 0;
    padding: 2px 4px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .del:hover { color: var(--out); }

  .empty {
    margin: 18px 0 4px;
    font-size: 15px;
    color: var(--ink-3);
  }

  .num-col { text-align: right; }

  /* ---------- phone ---------- */

  @media (max-width: 1000px) {
    .entry { grid-template-columns: 1fr 1fr; }
    .entry .field--wide { grid-column: 1 / -1; }
    .entry .btn--primary { grid-column: 1 / -1; }
    .summary { grid-template-columns: minmax(0, 1fr); }
    .summary__lead { padding: 0 0 20px; }
    .summary__grid { border-top: 0; padding: 0; }
    .summary__grid > div { padding: 0 20px 0 0; }
  }

  @media (max-width: 720px) {
    .shell { padding: 0 16px; }
    main { padding: 24px 0 56px; }
    h1 { font-size: 24px; }
    .summary__value { font-size: 38px; }
    .summary__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 0; }
    .panel { padding: 18px; }
    thead { display: none; }
    tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
    tbody td { border: 0; padding: 0; }
    tbody td.date { grid-column: 1; font-size: 13px; }
    tbody td.num { grid-column: 2; grid-row: 1; font-size: 16px; }
    tbody td.type { grid-column: 1; }
    tbody td.cat { grid-column: 1; }
    tbody td.note { grid-column: 1; font-size: 13px; }
    tbody td.actions { grid-column: 2; grid-row: 3; text-align: right; }
    .entry { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="shell topbar__inner">
    <a class="wordmark" href="index.html">Ledger</a>
    <div class="topbar__scope">
      <span>Shared key</span>
      <span class="keychip" id="currentKey">------</span>
    </div>
    <button class="btn btn--quiet" type="button" id="leaveBtn">Leave ledger</button>
  </div>
</header>

<main class="shell">
  <div class="titlerow">
    <div>
      <h1>Shared ledger</h1>
      <p class="finding" id="finding">Every entry below is visible to everyone holding this key.</p>
    </div>
  </div>

  <section class="panel summary" aria-label="Ledger totals">
    <div class="summary__lead">
      <span class="summary__label">Balance</span>
      <span class="summary__value" id="allSurplus">0.00</span>
    </div>
    <dl class="summary__grid">
      <div>
        <dt>This month in</dt>
        <dd class="is-in" id="income">0.00</dd>
      </div>
      <div>
        <dt>This month out</dt>
        <dd class="is-out" id="monthPay">0.00</dd>
      </div>
      <div>
        <dt>All time in</dt>
        <dd id="allSave">0.00</dd>
      </div>
    </dl>
  </section>

  <section class="panel">
    <h2>Add an entry</h2>
    <form class="entry" id="entryForm">
      <label class="field">
        <span>Date</span>
        <input class="input" type="date" id="billDate" required>
      </label>
      <label class="field">
        <span>Type</span>
        <select class="input" id="billType">
          <option value="deposit">Deposit</option>
          <option value="spend">Spend</option>
        </select>
      </label>
      <label class="field">
        <span>Category</span>
        <select class="input" id="billClass">
          <option value="screen-share">Screen share</option>
          <option value="deposit">Deposit</option>
          <option value="valorant">Valorant</option>
          <option value="gifting">Gifting</option>
          <option value="steam">Steam</option>
          <option value="voice-chat">Voice chat</option>
          <option value="friend-slot">Friend slot</option>
        </select>
      </label>
      <label class="field">
        <span>Amount</span>
        <input class="input input--num" type="number" step="0.01" min="0" placeholder="0.00" id="billMoney" required>
      </label>
      <label class="field field--wide">
        <span>Note</span>
        <input class="input" type="text" placeholder="Optional" id="billNote">
      </label>
      <button class="btn btn--primary" type="submit">Save entry</button>
    </form>
    <p class="formnote" id="entryNote" role="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <div class="panel__head">
      <h2>Entries</h2>
      <div class="filters">
        <label class="field">
          <span class="visually-hidden" hidden>Month</span>
          <select class="input" id="filterMonth" aria-label="Filter by month">
            <option value="">All months</option>
          </select>
        </label>
        <label class="field">
          <span class="visually-hidden" hidden>Type</span>
          <select class="input" id="filterType" aria-label="Filter by type">
            <option value="">All types</option>
            <option value="deposit">Deposits only</option>
            <option value="spend">Spending only</option>
          </select>
        </label>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Type</th>
          <th scope="col">Category</th>
          <th scope="col" class="num">Amount</th>
          <th scope="col">Note</th>
          <th scope="col"><span class="visually-hidden" hidden>Actions</span></th>
        </tr>
      </thead>
      <tbody id="billList"></tbody>
    </table>
    <p class="empty" id="emptyState" hidden></p>
  </section>
</main>

<script>
  const STORE = "shareBillStorage";

  const TYPE_LABELS = { deposit: "Deposit", spend: "Spend" };
  const CATEGORY_LABELS = {
    "screen-share": "Screen share",
    deposit: "Deposit",
    valorant: "Valorant",
    gifting: "Gifting",
    steam: "Steam",
    "voice-chat": "Voice chat",
    "friend-slot": "Friend slot"
  };

  // 旧版本存的是中文枚举值，读入时统一成英文 slug，历史数据不丢
  const TYPE_MIGRATION = { "存": "deposit", "扣": "spend" };
  const CATEGORY_MIGRATION = {
    "屏享": "screen-share",
    "存": "deposit",
    "瓦": "valorant",
    "送礼": "gifting",
    steam: "steam",
    "语聊": "voice-chat",
    "好友位": "friend-slot"
  };

  const money = (value) =>
    Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const globalShareKey = sessionStorage.getItem("activeBookKey");
  let shareBooks = JSON.parse(localStorage.getItem(STORE)) || {};

  if (!globalShareKey || !shareBooks[globalShareKey]) {
    alert("No ledger is open in this browser. Taking you back to the key screen.");
    window.location.href = "index.html";
  }

  migrate(shareBooks);
  document.getElementById("currentKey").textContent = globalShareKey;

  const dateInput = document.getElementById("billDate");
  dateInput.value = new Date().toISOString().slice(0, 10);

  function migrate(books) {
    let changed = false;
    Object.values(books).forEach((list) => {
      (list || []).forEach((bill) => {
        if (TYPE_MIGRATION[bill.type]) { bill.type = TYPE_MIGRATION[bill.type]; changed = true; }
        if (CATEGORY_MIGRATION[bill.class]) { bill.class = CATEGORY_MIGRATION[bill.class]; changed = true; }
      });
    });
    if (changed) localStorage.setItem(STORE, JSON.stringify(books));
  }

  function saveAllBooks() {
    localStorage.setItem(STORE, JSON.stringify(shareBooks));
  }

  function currentList() {
    return shareBooks[globalShareKey] || [];
  }

  function stats(list) {
    const month = new Date().toISOString().slice(0, 7);
    let monthIn = 0;
    let monthOut = 0;
    let totalIn = 0;
    let totalOut = 0;
    list.forEach((bill) => {
      const amount = Number(bill.money) || 0;
      if (bill.type === "deposit") {
        totalIn += amount;
        if (bill.date.startsWith(month)) monthIn += amount;
      } else {
        totalOut += amount;
        if (bill.date.startsWith(month)) monthOut += amount;
      }
    });
    return { monthIn, monthOut, totalIn, balance: totalIn - totalOut };
  }

  function syncMonthFilter() {
    const select = document.getElementById("filterMonth");
    const previous = select.value;
    const months = [...new Set(currentList().map((bill) => bill.date.slice(0, 7)))].sort().reverse();

    select.replaceChildren(new Option("All months", ""));
    months.forEach((month) => select.add(new Option(month, month)));
    select.value = months.includes(previous) ? previous : "";
  }

  function render() {
    syncMonthFilter();

    const month = document.getElementById("filterMonth").value;
    const type = document.getElementById("filterType").value;
    let rows = [...currentList()];
    if (month) rows = rows.filter((bill) => bill.date.startsWith(month));
    if (type) rows = rows.filter((bill) => bill.type === type);
    rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));

    const body = document.getElementById("billList");
    body.replaceChildren();

    rows.forEach((bill) => {
      const tr = document.createElement("tr");

      const dateCell = document.createElement("td");
      dateCell.className = "date";
      dateCell.textContent = bill.date;

      const typeCell = document.createElement("td");
      typeCell.className = "type";
      typeCell.textContent = TYPE_LABELS[bill.type] || bill.type;

      const catCell = document.createElement("td");
      catCell.className = "cat";
      catCell.textContent = CATEGORY_LABELS[bill.class] || bill.class;

      const amountCell = document.createElement("td");
      amountCell.className = "num";
      const sign = bill.type === "deposit" ? "+" : "-";
      const span = document.createElement("span");
      span.className = bill.type === "deposit" ? "amt--in" : "amt--out";
      span.textContent = sign + money(bill.money);
      amountCell.appendChild(span);

      const noteCell = document.createElement("td");
      noteCell.className = "note";
      noteCell.textContent = bill.note || "—";

      const actionCell = document.createElement("td");
      actionCell.className = "actions";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "del";
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", "Delete entry from " + bill.date);
      remove.addEventListener("click", () => deleteEntry(bill.id));
      actionCell.appendChild(remove);

      tr.append(dateCell, typeCell, catCell, amountCell, noteCell, actionCell);
      body.appendChild(tr);
    });

    const empty = document.getElementById("emptyState");
    const total = currentList().length;
    if (rows.length === 0) {
      empty.hidden = false;
      empty.textContent = total === 0
        ? "No entries yet. The first deposit or spend lands here, and everyone with the key sees it."
        : "No entries match these filters. Clear them to see the whole book.";
    } else {
      empty.hidden = true;
    }

    const summary = stats(currentList());
    document.getElementById("income").textContent = money(summary.monthIn);
    document.getElementById("monthPay").textContent = money(summary.monthOut);
    document.getElementById("allSave").textContent = money(summary.totalIn);
    document.getElementById("allSurplus").textContent = money(summary.balance);

    document.getElementById("finding").textContent = finding(summary);
  }

  function finding(summary) {
    const total = currentList().length;
    if (total === 0) return "An empty book. Add the first entry and the balance starts moving.";
    const gap = summary.monthIn - summary.monthOut;
    const monthName = new Date().toLocaleString("en-US", { month: "long" });
    if (gap === 0) return "Deposits and spending are level in " + monthName + ".";
    if (gap > 0) return "Deposits are " + money(gap) + " ahead of spending in " + monthName + ".";
    return "Spending is " + money(-gap) + " ahead of deposits in " + monthName + ". The balance is dropping.";
  }

  function addEntry(event) {
    event.preventDefault();
    const date = dateInput.value;
    const type = document.getElementById("billType").value;
    const category = document.getElementById("billClass").value;
    const amount = Number(document.getElementById("billMoney").value);
    const note = document.getElementById("billNote").value.trim();
    const noteEl = document.getElementById("entryNote");

    if (!date || !(amount > 0)) {
      noteEl.textContent = "A date and an amount above zero are required.";
      return;
    }

    shareBooks[globalShareKey].push({ id: Date.now(), date, type, class: category, money: amount, note });
    saveAllBooks();
    noteEl.textContent = "";
    document.getElementById("billMoney").value = "";
    document.getElementById("billNote").value = "";
    render();
    document.getElementById("billMoney").focus();
  }

  function deleteEntry(id) {
    shareBooks[globalShareKey] = currentList().filter((bill) => bill.id !== id);
    saveAllBooks();
    render();
  }

  document.getElementById("entryForm").addEventListener("submit", addEntry);
  document.getElementById("leaveBtn").addEventListener("click", () => {
    sessionStorage.removeItem("activeBookKey");
    window.location.href = "index.html";
  });
  document.getElementById("filterMonth").addEventListener("change", render);
  document.getElementById("filterType").addEventListener("change", render);

  render();
</script>
</body>
</html>
